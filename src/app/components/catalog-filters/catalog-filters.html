<aside class="filters-sidebar">
  <div class="filters-container">
    <h3>Filtros</h3>
    
    <div class="filter-group">
      <label>Buscar</label>
      <input
        type="text"
        [ngModel]="busca()"
        (ngModelChange)="busca.set($event)"
        placeholder="Marca ou modelo..."
        [matAutocomplete]="auto"
        class="search-input" />
      <mat-autocomplete #auto="matAutocomplete">
        @for (sugestao of sugestoes(); track sugestao) {
          <mat-option [value]="sugestao">{{ sugestao }}</mat-option>
        }
      </mat-autocomplete>
    </div>

    <div class="filter-group">
      <label>Ano</label>
      <app-selector-input
        [options]="anosOptions()"
        placeholder="Qualquer ano"
        icon="calendar_today"
        (valueChange)="onAnoChange($event)" />
    </div>

    <div class="filter-group">
      <label>Combustível</label>
      <app-selector-input
        [options]="combustiveisOptions()"
        placeholder="Qualquer combustível"
        icon="local_gas_station"
        (valueChange)="onCombustivelChange($event)" />
    </div>

    <div class="filter-actions">
      <button class="btn-search" (click)="buscar()">
        <span class="app-icon">search</span>
        Buscar
      </button>
      <button class="btn-clear-filters" (click)="limparFiltros()">
        Limpar
      </button>
    </div>
  </div>
</aside>
