<header class="header">
  <div class="container header-inner">

    <a class="logo" routerLink="/home">
      <img src="images/GERAL CAR.svg" alt="Geral Car">
    </a>

    <nav class="nav" [class.mobile-open]="isMenuOpen()">
      @for (link of navLinks; track link.path) {
        <a
          class="nav-link"
          [routerLink]="link.path"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: link.exact }"
          (click)="closeMenu()">
          {{ link.label }}
        </a>
      }
    </nav>

    <button 
      class="mobile-menu-toggle" 
      (click)="toggleMenu()"
      [attr.aria-label]="isMenuOpen() ? 'Fechar menu' : 'Abrir menu'">
      <span class="app-icon">{{ menuIcon() }}</span>
    </button>

    <div class="header-actions">
      <a class="btn btn-ghost btn-sm" [routerLink]="['/login']">
        <span class="app-icon">admin_panel_settings</span>
        Admin
      </a>
    </div>

  </div>
</header>
