services:
  geral-car-api:
    container_name: geral-car-api
    image: danielcampossantos/geral-car-api:0.0.1-SNAPSHOT
    environment:
      SPRING_DATASOURCE_USERNAME: ${ENV_POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${ENV_POSTGRES_PASSWORD}
      SPRING_DATASOURCE_URL: ${ENV_POSTGRES_URL}
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY}
    ports:
      - "8080:8080"
    volumes:
      - geralcar_imagens:/app/imagens
volumes:
  geralcar_imagens: